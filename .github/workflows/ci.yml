name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  linting:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check Expo project
        run: npm exec -- expo-doctor
        working-directory: frontend

      - name: Check Drizzle schema
        run: npm run db:generate
        working-directory: backend

      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=critical
        working-directory: backend

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: maiadb
          POSTGRES_PASSWORD: maia
          POSTGRES_USER: maia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maia -d maiadb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://maia:maia@localhost:5432/maiadb
      JWT_SECRET: ci-integration-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Apply database migrations
        run: npm run db:migrate
        working-directory: backend

      - name: Run backend tests
        run: npm test -- --passWithNoTests
        working-directory: backend

      - name: Run authentication integration test
        run: npm run test:integration
        working-directory: backend

  sonarqube:
    name: SonarQube quality gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - linting
      - tests
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate backend coverage
        run: npm test -- --coverage --runInBand
        working-directory: backend

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Fail when open issues remain
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          response=$(curl --fail --silent --show-error --get \
            'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=maia-organization_maia-mobile-app' \
            --data-urlencode "pullRequest=${PR_NUMBER}" \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=1')
          issue_count=$(jq --raw-output '.total' <<< "${response}")

          if [ "${issue_count}" -gt 0 ]; then
            echo "SonarQube reports ${issue_count} open issue(s)."
            exit 1
          fi

  build:
    name: Build Docker services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker services
        run: docker compose build
